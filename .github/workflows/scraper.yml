name: Hourly Civic RSS Scraper

on:
  # Runs at minute 0 past every hour
  schedule:
    - cron: '0 * * * *'
  
  # Allows you to click a button in GitHub to run it manually
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches a stable, modern Python version
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper Script
        env:
          # This securely injects the secret you saved in GitHub into the runner
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python rss_scraper.py